version: '3.8'

services:
  aetherion_backend:
    build: ../../backend/erlang_core
    ports:
      - "8080:8080"
    environment:
      - NODE_NAME=aetherion_master

  newtonian_guard:
    build: ../../security/newtonian_guard
    privileged: true # Required to adjust routing/void-tables if fully implemented
    network_mode: "host"

  postgres_supersonic:
    image: postgres:latest
    environment:
      POSTGRES_DB: aetherion_relational
      POSTGRES_PASSWORD: supersecretquantum
    ports:
      - "5432:5432"

  cassandra_supersonic:
    image: cassandra:latest
    ports:
      - "9042:9042"
